<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Lato", sans-serif;
            }
        </style>
        <title>Daftar - Chill</title>
    </head>
    <body
        style="
            background-image: url(&quot;assets/background/bg-signup.jpg&quot;);
            background-size: cover;
            background-position: center;
        "
    >
        <div
            class="flex items-center justify-center min-h-screen mx-auto text-white"
        >
            <div
                class="bg-[#181A1CD6] opacity-[.84] p-6 lg:p-10 rounded-2xl w-[306px] lg:w-[529px]"
            >
                <img
                    src="assets/logo/logo-new.png"
                    alt="Logo"
                    class="w-[94px] lg:w-[163px] mx-auto"
                />
                <div class="flex flex-col items-center gap-[4px] lg:gap-[8px]">
                    <h3 class="mt-6 text-lg font-bold lg:text-2xl">Daftar</h3>
                    <p class="text-xs lg:text-base">Selamat datang</p>
                </div>
                <div class="flex flex-col gap-[6px] mt-4">
                    <label class="text-xs lg:text-lg">Username</label>
                    <input
                        type="text"
                        class="w-full px-5 py-[8px] lg:py-[14px] text-[#C1C2C4] text-xs lg:text-base rounded-3xl border border-[#E7E3FC3B] focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan username Anda"
                    />
                </div>
                <div class="flex flex-col gap-[6px] mt-4 mb-3">
                    <label class="text-xs lg:text-lg">Kata Sandi</label>
                    <div class="relative">
                        <input
                            id="passwordInput"
                            type="password"
                            class="w-full px-5 py-[8px] lg:py-[14px] pr-12 text-[#C1C2C4] text-xs lg:text-base rounded-3xl border border-[#E7E3FC3B] focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Masukkan kata sandi"
                        />
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-[#C1C2C4] hover:text-white"
                        >
                            <!-- Icon Mata Terbuka -->
                            <svg
                                id="iconShow"
                                xmlns="http://www.w3.org/2000/svg"
                                class="hidden w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                />
                            </svg>
                            <!-- Icon Mata Tertutup -->
                            <svg
                                id="iconHide"
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.3-3.592M6.53 6.533A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411M3 3l18 18"
                                />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="flex flex-col gap-[6px] mt-4 mb-3">
                    <label class="text-xs lg:text-lg"
                        >Konfirmasi Kata Sandi</label
                    >
                    <input
                        type="password"
                        class="w-full px-5 py-[8px] lg:py-[14px] text-[#C1C2C4] text-xs lg:text-base rounded-3xl border border-[#E7E3FC3B] focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Konfirmasi kata sandi"
                    />
                </div>
                <div class="flex items-center justify-between mb-6">
                    <span class="text-[#C1C2C4] text-xs lg:text-base"
                        >Sudah punya akun?
                        <a
                            href="login.html"
                            class="text-xs text-white lg:text-base hover:underline"
                            >Masuk</a
                        ></span
                    >
                    <a
                        href="#"
                        class="text-xs text-white lg:text-base hover:underline"
                        >Lupa kata sandi?</a
                    >
                </div>
                <button
                    class="w-full h-[50px] bg-[#3D4142] px-5 py-[8px] lg:py-[14px] rounded-3xl text-xs lg:text-base text-white border border-[#E7E3FC]/23 flex items-center justify-center"
                >
                    Daftar
                </button>
                <p class="w-full py-2 text-xs text-center lg:text-base">Atau</p>
                <button
                    class="w-full h-[47px] bg-[#3D4142] px-5 py-[8px] lg:py-[14px] rounded-3xl text-xs lg:text-base text-white border border-[#E7E3FC]/23 flex items-center justify-center gap-2"
                >
                    <img
                        src="assets/icons/google.png"
                        alt="Google Icon"
                        class="w-[10px] h-[10px] lg:w-5 lg:h-5"
                    />
                    Masuk dengan Google
                </button>
            </div>
        </div>
    </body>
</html>

<script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#passwordInput");
    const iconShow = document.querySelector("#iconShow");
    const iconHide = document.querySelector("#iconHide");

    togglePassword.addEventListener("click", function () {
        // Toggle the type attribute
        const type =
            passwordInput.getAttribute("type") === "password"
                ? "text"
                : "password";
        passwordInput.setAttribute("type", type);

        // Toggle the icons
        iconShow.classList.toggle("hidden");
        iconHide.classList.toggle("hidden");
    });
</script>
