<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Lato", sans-serif;
            }
        </style>
        <title>Login - Chill</title>
    </head>
    <body
        style="
            background-image: url(&quot;assets/background/bg-signin.jpg&quot;);
            background-size: cover;
            background-position: center;
        "
    >
        <div
            class="flex items-center justify-center min-h-screen mx-auto text-white"
        >
            <div class="bg-[#181A1CD6] opacity-[.84] p-6 lg:p-10 rounded-2xl w-[306px] lg:w-[529px]">
                <img
                    src="assets/logo/logo-new.png"
                    alt="Logo"
                    class="w-[94px] lg:w-[163px] mx-auto"
                />
                <div class="flex flex-col items-center gap-[4px] lg:gap-[8px]">
                    <h3 class="mt-6 text-lg font-bold lg:text-2xl">Masuk</h3>
                    <p class="text-xs lg:text-base">Selamat datang kembali</p>
                </div>
                <div class="flex flex-col gap-[6px] mt-4">
                    <label class="text-xs lg:text-lg">Username</label>
                    <input
                        type="text"
                        class="w-full px-5 py-[8px] lg:py-[14px] text-[#C1C2C4] text-xs lg:text-base rounded-3xl border border-[#E7E3FC3B] focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan username Anda"
                    />
                </div>
                <div class="flex flex-col gap-[6px] mt-4 mb-3">
                    <label  class="text-xs lg:text-lg">Kata Sandi</label>
                    <input
                        type="password"
                        class="w-full px-5 py-[8px] lg:py-[14px] text-[#C1C2C4] text-xs lg:text-base rounded-3xl border border-[#E7E3FC3B] focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan kata sandi"
                    />
                </div>
                <div class="flex items-center justify-between mb-6">
                    <span class="text-[#C1C2C4] text-xs lg:text-base">Belum punya akun? <a href="register.html" class="text-xs text-white lg:text-base hover:underline">Daftar</a></span>
                    <a href="#" class="text-xs text-white lg:text-base hover:underline">Lupa kata sandi?</a>
                </div>
                <button class="w-full bg-[#3D4142] px-5 py-[8px] lg:py-[14px] rounded-3xl text-xs lg:text-base text-white border border-[#E7E3FC]/23" onclick="window.location.href = 'index.html'">
                  Masuk
                </button>
                <p class="w-full py-2 text-xs text-center lg:text-base">Atau</p>
                <button class="w-full bg-[#3D4142] px-5 py-[8px] lg:py-[14px] rounded-3xl text-xs lg:text-base text-white border border-[#E7E3FC]/23 flex items-center justify-center gap-2">
                  <img src="assets/icons/google.png" alt="Google Icon" class="w-[10px] h-[10px] lg:w-5 lg:h-5" />
                  Masuk dengan Google
                </button>
            </div>
        </div>
    </body>
</html>
